# Perfil de producao: PostgreSQL (ex.: Neon Postgres, Render Postgres).
# Ativar no Render com SPRING_PROFILES_ACTIVE=prod.
# As credenciais devem ficar na URL (SPRING_DATASOURCE_URL) — nunca em codigo/git.

# Conexao vinda de variavel de ambiente configurada na plataforma.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialeto PostgreSQL (Hibernate 6).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# DDL continua gerenciado apenas pelo Flyway.
spring.jpa.hibernate.ddl-auto=none

# Migracoes PostgreSQL ficam em local separado das do SQLite (dev/testes).
spring.flyway.locations=classpath:db/migration-postgres