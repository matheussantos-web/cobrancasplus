# ========================
# Aplicacao
# ========================
spring.application.name=emprestimos-backend
# Porta do servidor: em provers (ex.: Render) a variavel PORT e injetada
# dinamicamente; localmente usa 8080.
server.port=${PORT:8080}

# ========================
# Banco de Dados SQLite (dev/testes local)
# ========================
# SQLite: banco local de desenvolvimento/testes (perfil default). Em producao
# o perfil 'prod' usa PostgreSQL via SPRING_DATASOURCE_URL (application-prod.properties).
# Se SPRING_DATASOURCE_URL nao for definido aqui, usa /tmp (efemero no container).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:/tmp/emprestimos.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Hibernate + SQLite: use o dialeto da comunidade. Identity id gerado via capacidade do driver.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Estrutura gerenciada por Flyway (db/migration) -- Hibernate NAO altera o schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ========================
# Flyway (migracoes versionadas)
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ========================
# SQLite WAL (Write-Ahead Logging)
# ========================
# Ativa o modo WAL para evitar travamento de arquivo em acessos concorrentes.
# PRAGMA e executado a cada nova conexao via DataSource inicializador.
spring.sql.init.mode=never

# ========================
# JWT
# ========================
# OBRIGATORIO via variavel de ambiente em producao (e em dev). Sem fallback:
# se JWT_SECRET nao estiver definido, o boot falha (verifique JwtService).
# Minimo seguro: 48 bytes (384 bits) para HS384.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ========================
# Cookie de sessao (JWT httpOnly)
# ========================
# secure=true exige HTTPS (ou localhost, tratado como contexto seguro pelos
# navegadores). Em redes locais via http/IP, defina COOKIE_SECURE=false.
app.cookie.secure=${COOKIE_SECURE:true}
# SameSite do cookie de sessao. Strict/Lax preservam protecao CSRF em mesmo
# site; quando frontend e backend estao em dominios distintos (cross-site,
# ex.: Vercel + Render), defina COOKIE_SAME_SITE=None (exige COOKIE_SECURE=true).
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# ========================
# CORS
# ========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ========================
# Validacao de e-mail (registro)
# ========================
# Confere se o dominio do e-mail possui registros MX (DNS) antes de cadastrar,
# bloqueando dominios inexistentes/aleatorios. Em testes/CI desative com
# app.email.validar-mx=false para evitar chamadas de rede.
app.email.validar-mx=${VALIDAR_MX:true}

# ========================
# Servidor
# ========================
server.error.include-message=always
# Threads do Tomcat reduzidas para instancias pequenas (Render free: 0.1 CPU/512 MB)
# — menos pilhas nativas e memoria residente; suficiente para uso pessoal.
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4