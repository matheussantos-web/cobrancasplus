# Fly.io — deploy do backend Spring Boot
# Uso: (na pasta backend/)  fly launch --no-deploy   |   fly secrets set ...   |   fly deploy
app = "cobrancas-backend"
primary_region = "gru"  # Sao Paulo; alternativas: iad / mia

[build]
  dockerfile = "Dockerfile"

[env]
  # O backend escuta em server.port=${PORT:8080}; o Fly injeta PORT no runtime.
  PORT = "8080"
  # Ativa o perfil prod (PostgreSQL/Neon + db/migration-postgres).
  SPRING_PROFILES_ACTIVE = "prod"
  # Spring resolve a env por convencao (SPRING_PROFILES_ACTIVE), sem props extras.

[http_service]
  internal_port = 8080
  force_https = true
  # Mantem 1 maquina sempre ligada: evita cold start de ~18s da JVM e queda da
  # primeira requisicao (auto_stop com min_machines_running=0 derrubava requests).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1