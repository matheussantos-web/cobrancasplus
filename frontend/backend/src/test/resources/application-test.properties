# Perfil de teste: isola o banco do de desenvolvimento.
# O application.properties principal (main) continua carregado/propagado.
spring.datasource.url=jdbc:sqlite:./data/test-emprestimos.db

# Secret dedicado aos testes (>= 48 bytes) — nunca usar em producao.
app.jwt.secret=test-secret-cobrancas-plus-teste-0123456789-abcdefghijklmnopqrstuvwxyz

# Registro sem consulta DNS (dominios sinteticos de teste, ex.: @teste.com).
app.email.validar-mx=false